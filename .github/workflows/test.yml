name: test.yml
on:
  workflow_dispatch:
  workflow_call: 
  push:
   branches:
    - dev

permissions:
  id-token: write

jobs:
  test:
   runs-on: ubuntu-latest
   steps:
    - uses: actions/checkout@v6

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@main
      with:
        role-to-assume: arn:aws:iam::331208495907:role/github_action_oidc
        aws-region: ap-northeast-2

    - name: SSM Parameter Store Env Loader
      uses: luviny/aws-ssm-parameter-store-env-loader@v1.1.1
      id: ssm
      with:
        aws-base-path: /test
        aws-region: ap-northeast-2
        env-file-name: .env.test
        load-env: true

    - uses: ./
      with:
        gzip-env-value: ${{ steps.ssm.outputs.gzip-env-value }}
        load-env: true
        env-file-name: .env
        
    - name: Env Test
      run: echo "${{ env }}"
      
    - name: Env File Test
      run: cat .env